<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MindfulIntentions Aerobic Premium Logo Bold">
  <defs>
    <!-- Rich but not eye-harsh -->
    <radialGradient id="bg" cx="30%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#ff9a6a"/>
      <stop offset="42%" stop-color="#d32626"/>
      <stop offset="100%" stop-color="#4a0b12"/>
    </radialGradient>

    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe9b8"/>
      <stop offset="50%" stop-color="#ffc766"/>
      <stop offset="100%" stop-color="#f39a2f"/>
    </linearGradient>

    <linearGradient id="athlete" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe9d2"/>
    </linearGradient>

    <filter id="athleteGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- strong premium badge -->
  <circle cx="256" cy="256" r="244" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gold)" stroke-width="9"/>
  <circle cx="256" cy="256" r="208" fill="none" stroke="rgba(255,216,150,0.34)" stroke-width="2"/>

  <!-- brighter kinetic rings -->
  <path d="M78 288c48-50 112-78 178-78s130 28 178 78"
        fill="none" stroke="rgba(255,209,129,0.58)" stroke-width="11" stroke-linecap="round"/>
  <path d="M102 322c42-39 98-60 154-60s112 21 154 60"
        fill="none" stroke="rgba(255,173,92,0.46)" stroke-width="8" stroke-linecap="round"/>

  <!-- clearer athlete -->
  <g filter="url(#athleteGlow)" stroke="url(#athlete)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="274" cy="166" r="17" fill="url(#athlete)" stroke="none"/>
    <path d="M260 186 L228 246 L284 276" stroke-width="18"/>
    <path d="M248 214 L330 202" stroke-width="14"/>
    <path d="M248 214 L188 186" stroke-width="12"/>
    <path d="M284 276 L352 320" stroke-width="16"/>
    <path d="M284 276 L220 348" stroke-width="16"/>
  </g>

  <!-- energetic streak -->
  <path d="M174 176c-26 8-49 24-66 46" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <path d="M162 214c-24 10-43 28-56 50" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" opacity="0.72"/>

  <!-- base highlight -->
  <path d="M176 382c46 30 114 30 160 0" fill="none" stroke="rgba(255,236,198,0.92)" stroke-width="8" stroke-linecap="round"/>
</svg>
